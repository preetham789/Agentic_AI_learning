    { name = "preetham p", email = "preethamgowda12052003@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-cohere>=0.6.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-litellm>=0.7.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.4.2",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langsmith>=0.10.17",
    "litellm>=1.100.1",
    "markdown>=3.10.3",
    "mcp[cli]>=1.3.0,<2.0.0",
    "openai>=2.53.0",
    "psycopg2-binary>=2.9.12",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.51",
    "torch>=2.13.0",
]

[project.scripts]
agentic-ai = "agentic_ai:main"

[build-system]
